services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: asigner
      POSTGRES_PASSWORD: asigner
      POSTGRES_DB: asigner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asigner"]
      interval: 5s
      retries: 10

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  server:
    build: ./server
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://asigner:asigner@postgres:5432/asigner
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      # Recorded clips and the trained model live on the host, so they survive
      # rebuilds and training on the host can feed the container.
      - ./server/data:/app/data
      - ./server/models:/app/models
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_URL: http://server:8000
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  pgdata:
  ollama:

# Lesson content. Each sign is either a bare gloss or a mapping with
# gloss / description / demo_path / sign_bank_url.
#
# demo_path points at a landmark clip under web/public/demos, written by
# ml/export_demos.py from the recorded takes. Signs with no takes have none.
#
# Descriptions are deliberately left empty: they must be written against the
# SgSL Sign Bank and checked by an SgSL signer before the app presents them.
lessons:
  - slug: alphabet
    title: Fingerspelling A-Z
    summary: The one-handed manual alphabet used in SgSL.
    signs:
      - {gloss: "A", demo_path: /demos/A.json}
      - {gloss: "B", demo_path: /demos/B.json}
      - {gloss: "C", demo_path: /demos/C.json}
      - {gloss: "D", demo_path: /demos/D.json}
      - {gloss: "E", demo_path: /demos/E.json}
      - {gloss: "F", demo_path: /demos/F.json}
      - {gloss: "G", demo_path: /demos/G.json}
      - {gloss: "H", demo_path: /demos/H.json}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # The noticeboard PR is coordination only and is never merged.
    branches-ignore: [noticeboard]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asigner
          POSTGRES_PASSWORD: asigner
          POSTGRES_DB: asigner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asigner"
          --health-interval 5s
          --health-retries 10
    env:
      PG_URL: postgresql+psycopg://asigner:asigner@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (SQLite)
        run: pytest
      - name: Migration applies to Postgres and matches the models
        env:
          DATABASE_URL: ${{ env.PG_URL }}/asigner
        run: |
          alembic upgrade head
          alembic check
          python -m app.seed
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: ${{ env.PG_URL }}/asigner_test
        run: |
          PGPASSWORD=asigner createdb -h localhost -U asigner asigner_test
          pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Route types such as LayoutProps are generated, not committed.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
